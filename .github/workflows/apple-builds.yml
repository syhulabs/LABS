name: Apple builds (macOS + iOS)

# Builds SYHU Account Hub for macOS and iOS on a hosted Mac, runs the test
# suite, and uploads the apps as artifacts. iOS is built unsigned
# (--no-codesign): install it via Xcode / TestFlight after signing with your
# team, or run it on a simulator.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["account-hub/**", ".github/workflows/apple-builds.yml"]
  workflow_dispatch:

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: account-hub
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Toolchain report
        run: |
          flutter --version
          xcodebuild -version
          flutter doctor -v

      - name: Dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Tests
        run: flutter test --timeout 120s

      - name: Build macOS (release)
        run: flutter build macos --release

      - name: Build iOS (release, unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package artifacts
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "build/macos/Build/Products/Release/SYHU Account Hub.app" "dist/SYHU-Account-Hub-macOS.zip"
          ditto -c -k --sequesterRsrc --keepParent "build/ios/iphoneos/Runner.app" "dist/SYHU-Account-Hub-iOS-unsigned.zip"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: SYHU-Account-Hub-macOS
          path: account-hub/dist/SYHU-Account-Hub-macOS.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: SYHU-Account-Hub-iOS-unsigned
          path: account-hub/dist/SYHU-Account-Hub-iOS-unsigned.zip
          if-no-files-found: error

  # Signed iOS build uploaded to TestFlight. Runs only when the signing secrets
  # exist (see docs/BUILD.md → "TestFlight from CI").
  testflight:
    needs: apple
    if: ${{ github.event_name != 'pull_request' && vars.TESTFLIGHT_ENABLED == 'true' }}
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: account-hub
    env:
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID || 'com.syhulabs.syhuAccountHub' }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          p12-password: ${{ secrets.IOS_DIST_P12_PASSWORD }}

      - name: Download App Store provisioning profile
        id: profiles
        uses: apple-actions/download-provisioning-profiles@v4
        with:
          bundle-id: ${{ env.BUNDLE_ID }}
          profile-type: IOS_APP_STORE
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}

      - name: Build number from run number
        run: echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Export options
        run: |
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$(security cms -D -i "${{ fromJSON(steps.profiles.outputs.profiles)[0].path }}")")
          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' /dev/stdin <<< "$(security cms -D -i "${{ fromJSON(steps.profiles.outputs.profiles)[0].path }}")")
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key><dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"

      - name: Build signed IPA
        run: |
          flutter pub get
          flutter build ipa --release \
            --build-number="$BUILD_NUMBER" \
            --export-options-plist=ExportOptions.plist \
            --dart-define=FLUTTER_BUILD_NAME=0.1.0
          ls -la build/ios/ipa

      - name: Upload to TestFlight
        uses: apple-actions/upload-testflight-build@v3
        with:
          app-path: account-hub/build/ios/ipa/syhu_account_hub.ipa
          issuer-id: ${{ secrets.ASC_ISSUER_ID }}
          api-key-id: ${{ secrets.ASC_KEY_ID }}
          api-private-key: ${{ secrets.ASC_PRIVATE_KEY }}
