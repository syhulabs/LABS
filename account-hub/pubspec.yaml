name: syhu_account_hub
description: "SYHU Account Hub: private, local-first digital ecosystem manager by SYHU LABS."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Local database (SQLite via drift; one relational DB for every section)
  drift: ^2.35.3
  drift_flutter: ^0.3.1
  sqlite3: ^3.8.0
  path_provider: ^2.1.6
  path: ^1.9.1

  # Security
  flutter_secure_storage: ^11.2.0   # Keychain (macOS/iOS), Keystore (Android), libsecret (Linux)
  local_auth: ^3.0.2                # Touch ID / Face ID / Android biometrics
  cryptography: ^2.9.0              # AES-GCM, PBKDF2 (no custom crypto)

  # Platform services
  flutter_local_notifications: ^22.3.2
  url_launcher: ^6.3.3
  file_picker: ^13.2.0
  share_plus: ^13.3.1

  # UI
  fl_chart: ^1.3.0
  simple_icons: ^16.23.0            # CC0 brand glyphs + official brand colors
  flutter_svg: ^2.3.0
  cupertino_icons: ^1.0.8

  # Utilities
  intl: ^0.20.3
  timezone: ^0.11.0
  uuid: ^4.6.0
  collection: ^1.19.1
  crypto: ^3.0.7
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/catalog/
    - assets/logos/
